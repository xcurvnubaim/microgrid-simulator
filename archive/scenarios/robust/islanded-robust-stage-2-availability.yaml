# Robustness / robust-SAC fine-tuning — stage 2: forecast residuals + availability.
#
# Adds forecast-SERVICE failure (stale/missing updates) on top of stage 1's
# residual noise. ``dropout_prob`` is the per-refresh probability a forecast
# update is suppressed; the retained snapshot goes stale and eventually turns
# availability off, forcing the policy to cope with an exhausted horizon.
extends: ../islanded-baseline-72h.yaml

scenario:
  name: islanded_robust_stage2_forecast_availability

rl:
  total_timesteps: 50000
  n_envs: 4
  device: cuda
  forecast_mode: cached

uncertainty:
  enabled: true
  seed: 0
  forecast:
    enabled: true
    residual_pv_std: 0.05
    residual_demand_std: 0.05
    horizon_slope: 0.02
    dropout_prob: 0.10
    dropout_block_steps: 8
