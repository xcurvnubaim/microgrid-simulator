# Disjoint held-out evaluation: 72 h provenance-labelled reconstructed load/PV replay,
# 15 min control. Measured and reconstructed rows remain distinguishable in the source
# candidate artifacts.
# The plant assumptions and controller settings intentionally match
# islanded-baseline-72h.yaml; only the scenario identity and telemetry window differ.

scenario:
  name: islanded_heldout_72h_2026-03-08
  description: Disjoint held-out campus load/PV replay using the reconstruction candidates with the same assumed BESS/diesel plant used by the January baseline.

topology:
  timestep_hours: 0.25
  solver: ac
  n_pv: 2
  n_storage: 1
  n_ev: 0
  n_load: 3

backend:
  name: pandapower
  validation_backend: pandapower

episode:
  horizon_hours: 72.0
  start_hour: 0.0
  # First evaluated interval; 2026-03-07 23:45 is context only.
  telemetry_start: "2026-03-08 00:00:00"

# Use the same pre-generated Chronos cache contract as training. Records are
# loaded into memory once and hourly forecasts serve four 15-minute decisions.
forecast:
  enabled: true
  horizon_hours: 24
  refresh_each_step: true
  strict_cache: true
  cache_path: data/forecasts.jsonl
  manifest_path: data/forecast_manifest.json
  source_id: islanded_72h_2026-01-15

rl:
  algo: sac
  total_timesteps: 50000
  seed: 0
  normalize: true
  n_envs: 4
  device: cuda
  train_split: train
  eval_split: val
  forecast_mode: cached

digital_twin:
  fill_strategy: error
  max_gap_steps: 0
  max_missing_fraction: 0.0
  measurements:
    load:
      file: /home/xcurv/teep-taiwan/data/processed/demand_15min_weekly_seasonal_reconstruction_candidate.csv
      header_row: 0
      timestamp_column: timestamp
      value_column: demand_kw
      unit: kw
    pv:
      file: /home/xcurv/teep-taiwan/data/processed/pv_15min_chronos_reconstruction_candidate.csv
      header_row: 0
      timestamp_column: timestamp
      value_column: pv_kw
      unit: kw

demand:
  enabled: false
  file: null
  random_window: false

# Assumed scheduling-tier BESS values; the physical nameplate is unavailable.
battery:
  bus: 3
  capacity_mwh: 0.50
  charge_eff: 0.96
  discharge_eff: 0.96
  max_charge_mw: 0.25
  max_discharge_mw: 0.25
  soc_min: 0.10
  soc_max: 0.95
  soc_init: 0.50

# Assumed scheduling-tier diesel values; the physical datasheet is unavailable.
diesel:
  enabled: true
  bus: 0
  max_kw: 150.0
  min_kw: 45.0
  ramp_kw_per_min: 30.0
  min_up_time_min: 30.0
  min_down_time_min: 15.0
  carbon_kg_per_kwh: 0.70

# Used only by the optional schedule policy; rule and MPC ignore it.
diesel_schedule:
  segments:
    - {start_hour: 0.0,  end_hour: 9.0,  level: max}
    - {start_hour: 9.0,  end_hour: 14.0, level: min}
    - {start_hour: 14.0, end_hour: 24.0, level: max}

reward:
  w_carbon: 4.0              # diesel is genuinely costly: fuel + carbon dominate
  w_autonomy: 0.0
  w_health: 0.5               # relax battery-degradation penalty so discharge is viable
  w_waste: 1.0
  w_excess: 1.0             # diesel/other surplus routed to the explicit dump load
  w_unserved: 20.0            # load service is the scenario's primary objective; raised from 5.0 on 2026-08-05
  grid_carbon_kg_per_kwh: 0.45
  diesel_carbon_kg_per_kwh: 0.70
  diesel_fuel_cost_per_kwh: 0.40   # fuel cost added to the diesel penalty
  diesel_start_cost: 1.0           # $ per start
  import_price: 180.0
  peak_threshold_mw: 0.35
  peak_penalty: 200.0
  voltage_penalty: 100.0
  soc_violation_penalty: 50.0

# No utility-role bus: the held-out scheduling episode is islanded.
buses:
  - {id: 0, name: Main distribution, vn_kv: 0.4, role: main, x: 290, y: 150}
  - {id: 1, name: PV yard, vn_kv: 0.4, role: pv, x: 520, y: 60}
  - {id: 2, name: Academic loads, vn_kv: 0.4, role: load, x: 760, y: 150}
  - {id: 3, name: Battery storage, vn_kv: 0.4, role: battery, x: 760, y: 240}

lines:
  - {name: PV feeder, from_bus: 0, to_bus: 1, kind: line, length_km: 0.18, max_i_ka: 1.0}
  - {name: Academic feeder, from_bus: 0, to_bus: 2, kind: line, length_km: 0.28, max_i_ka: 1.0}
  - {name: Battery feeder, from_bus: 0, to_bus: 3, kind: line, length_km: 0.16, max_i_ka: 1.0}

pv_arrays:
  - {name: PV array 0, bus: 1, p_mw: 0.12}
  - {name: PV array 1, bus: 1, p_mw: 0.08}

# Measured total demand scales this assumed 3:2:2 allocation each interval.
loads:
  - {name: Academic load A, bus: 2, p_mw: 0.15, q_mvar: 0.030}
  - {name: Academic load B, bus: 2, p_mw: 0.10, q_mvar: 0.020}
  - {name: Academic load C, bus: 2, p_mw: 0.10, q_mvar: 0.020}
