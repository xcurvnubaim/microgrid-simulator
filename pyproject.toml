[project]
name = "microgrid-simulator"
version = "0.1.0"
description = "Gymnasium RL environment for a 5-bus campus microgrid (pandapower power flow, battery SoC physics, 5-term reward). Region 4 of the Microgrid Brain digital twin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xcurv" }]

dependencies = [
    # --- simulator core (the Environment) ---
    "pandapower>=2.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.8",
    # --- RL contract + agent ---
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    # --- config + cli ---
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    # --- real demand trace (xlsx export) ---
    "openpyxl>=3.1",
    # --- dashboard (FastAPI API + prebuilt React frontend) ---
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pypsa>=0.35.2",
    "opendssdirect-py>=0.9.4",
    "pvlib>=0.15.2",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional TensorBoard logging during training.
logging = [
    "tensorboard>=2.16",
]
# External benchmark only: LGPL-3.0 library loaded through the comparison
# adapter; it is not part of the campus simulator's production backend stack.
pymgrid = [
    # PyPI 1.4.1 predates the upstream NumPy-2 compatibility fixes.
    "python-microgrid @ git+https://github.com/ahalev/python-microgrid.git@09089cc",
]

[project.scripts]
microgrid-sim = "microgrid_simulator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/microgrid_simulator"]

# ---------------------------------------------------------------------------
# Tooling: one config block per tool, all in pyproject (single source of truth)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # pyflakes, isort, pyupgrade, bugbear, simplify

[tool.ruff.lint.per-file-ignores]
# Typer's declarative API *requires* function calls in argument defaults.
"src/microgrid_simulator/cli.py" = ["B008"]

[tool.mypy]
# Match the analysis target to a modern runtime so third-party stubs
# (e.g. numpy's PEP 695 `type` syntax) parse cleanly.
python_version = "3.12"
packages = ["microgrid_simulator"]
strict = true
ignore_missing_imports = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
