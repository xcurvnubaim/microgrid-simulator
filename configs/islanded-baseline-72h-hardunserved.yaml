# Deterministic paper baseline: 72 h provenance-labelled load/PV replay, 15 min control.
# ISLANDED PV + battery + diesel, load-serving purpose.
#
# PROVENANCE — this scenario is the Python implementation of the executable scheduling
# derivative and shares its documented topology and scheduling parameters:
#   Model  : Microgrid-Simscape/Models/CampusMicrogridScheduling.slx
#   Runner : Microgrid-Simscape/Campus/runCampusSchedulingModel72h.m
#   Record : Microgrid-Simscape/Campus/PROVENANCE.md  (subsystem evidence labels)
#
# Alignment note: values below are tagged MEASURED / RECONSTRUCTED / ASSUMED to match
# that record. The fixed replay uses provenance-labelled reconstruction candidates so
# the 72-hour window is continuous; source rows remain distinguishable in the artifacts.
# Physical BESS and diesel ratings have no site nameplate and stay ASSUMED. The retained
# Simscape artifacts establish ancestry only and are not executed in the active scope.

scenario:
  name: islanded_72h_hardunserved_2026-01-15
  description: Islanded PV + battery + diesel replay with the unserved-load HARD constraint. Any tick with unserved demand above the solver-noise tolerance terminates the episode with a one-shot infeasibility penalty; the soft w_unserved term is retained for reporting/residual signal.

topology:
  timestep_hours: 0.25
  solver: ac
  n_pv: 2
  n_storage: 1
  n_ev: 0
  n_load: 3

backend:
  name: pandapower
  validation_backend: pandapower

episode:
  horizon_hours: 72.0
  start_hour: 0.0
  # First evaluated interval; 2026-01-14 23:45 is loaded only as controller context.
  # Training/baseline window; the disjoint held-out config starts on 2026-03-08.
  telemetry_start: "2026-01-15 00:00:00"

# RL uses the pre-generated Chronos cache only. The JSONL is loaded once at
# startup and hourly records are reused for four 15-minute decisions; no HTTP
# request or foundation-model inference occurs during training.
forecast:
  enabled: true
  horizon_hours: 24
  refresh_each_step: true
  strict_cache: true
  cache_path: data/forecasts.jsonl
  manifest_path: data/forecast_manifest.json
  source_id: islanded_72h_2026-01-15

rl:
  algo: sac
  total_timesteps: 50000
  seed: 0
  normalize: true
  n_envs: 4
  device: cuda
  train_split: train
  eval_split: val
  forecast_mode: cached
  # Hard unserved-load constraint: a tick with real unserved demand ends the
  # episode immediately with a one-shot penalty (the soft w_unserved term is
  # retained for reporting/residual signal). Same telemetry as the baseline.
  hard_unserved: true
  # One-shot blackout penalty. Must dominate any incentive to end an episode
  # early: the cheapest intentional-blackout path (drain battery ~12h at ~0
  # reward then trip) costs ~1000 in the old tuning, while the cheapest safe
  # full-episode policy (diesel at min stable output, ~94/tick x 288) costs
  # ~27,000. With penalty 1000 SAC learned to black out at step ~12 because
  # 1000 << 27000; 50000 makes any blackout catastrophically worse than every
  # feasible full-length dispatch.
  hard_unserved_penalty: 50000.0
  hard_unserved_tol_mw: 0.002

digital_twin:
  fill_strategy: error
  max_gap_steps: 0
  max_missing_fraction: 0.0
  measurements:
    load:
      file: /home/xcurv/teep-taiwan/data/processed/demand_15min_weekly_seasonal_reconstruction_candidate.csv
      header_row: 0
      timestamp_column: timestamp
      value_column: demand_kw
      unit: kw
    pv:
      file: /home/xcurv/teep-taiwan/data/processed/pv_15min_chronos_reconstruction_candidate.csv
      header_row: 0
      timestamp_column: timestamp
      value_column: pv_kw
      unit: kw

# Disable the older independent demand-window loader: fixed digital-twin replay above
# supplies both demand and PV on the same timestamp grid and fails closed.
demand:
  enabled: false
  file: null
  random_window: false

# BESS — MATLAB grid-forming converter keeps its stock 1 MVA base; the 250 kW below is a
# DISPATCH reference, not a converter rating (BESS.pRef2 = 0.25 pu of 1 MVA). The EMT DC
# source is ideal, so energy capacity / efficiency / SOC are ASSUMED scheduling values
# that live only in this reduced-order layer.
battery:
  bus: 3
  capacity_mwh: 0.50          # ASSUMED; physical nameplate unavailable
  charge_eff: 0.96            # ASSUMED
  discharge_eff: 0.96         # ASSUMED
  max_charge_mw: 0.25         # = MATLAB BESS.pRef2 0.25 pu on 1 MVA base (250 kW dispatch cap)
  max_discharge_mw: 0.25      # same 250 kW dispatch cap
  soc_min: 0.10               # ASSUMED operating band
  soc_max: 0.95
  soc_init: 0.50              # ASSUMED initial SOC (no SOC state exists in the EMT model)

# Diesel — the EMT machine retains the stock 125.5 kVA synchronous machine
# (microgrid.dieselRatedPower = 125500); an electrical rescale to 150 kW was unstable.
# 150 kW here is the ASSUMED scheduling nameplate, inside the same assumption band.
diesel:
  enabled: true
  bus: 0
  max_kw: 150.0               # ASSUMED scheduling nameplate; EMT retains stock 125.5 kVA machine
  min_kw: 45.0               # ASSUMED 30% minimum stable load
  ramp_kw_per_min: 30.0      # ASSUMED
  min_up_time_min: 30.0      # ASSUMED
  min_down_time_min: 15.0    # ASSUMED
  carbon_kg_per_kwh: 0.70    # ASSUMED emissions proxy (no MATLAB counterpart; techno-econ used $1.1/L)

# Clock-driven diesel timetable for the `schedule` policy only (`--policy schedule`;
# rule/mpc ignore it). DESIGNED from this window's 3-day hourly load/PV profile: PV
# covers most demand 09:00-14:00 (hold min stable load — a first cut with `off` here
# lost to the rule baseline because PV swings ~47 kW within one 15-min step); full
# nameplate everywhere else so no PV dip or load spike outruns diesel within a tick.
# level: max | min | off | explicit kW (clamped to [min_kw, max_kw]); uncovered
# hours = off; start_hour > end_hour wraps past midnight.
diesel_schedule:
  segments:
    - {start_hour: 0.0,  end_hour: 9.0,  level: max}
    - {start_hour: 9.0,  end_hour: 14.0, level: min}
    - {start_hour: 14.0, end_hour: 24.0, level: max}

reward:
  w_carbon: 4.0              # diesel is genuinely costly: fuel + carbon dominate
  w_autonomy: 0.0             # islanded: no utility exchange exists
  w_health: 0.5               # relax battery-degradation penalty so discharge is viable
  w_waste: 1.0
  w_excess: 1.0             # diesel/other surplus routed to the explicit dump load
  w_unserved: 20.0            # load service is the scenario's primary objective; raised from 5.0 on 2026-08-05
  # Grid-connected terms below are INERT in this islanded scenario (no grid-role bus);
  # retained so grid-connected scenario variants can reuse the same reward block.
  grid_carbon_kg_per_kwh: 0.45
  diesel_carbon_kg_per_kwh: 0.70
  diesel_fuel_cost_per_kwh: 0.40   # ≈ $0.40/kWh fuel — running the genset is no longer free
  diesel_start_cost: 1.0           # $ per start, discourages rapid cycling
  import_price: 180.0
  peak_threshold_mw: 0.35
  peak_penalty: 200.0
  voltage_penalty: 100.0
  soc_violation_penalty: 50.0

# No utility-role bus: the complete scheduling episode is islanded.
buses:
  - {id: 0, name: Main distribution, vn_kv: 0.4, role: main, x: 290, y: 150}
  - {id: 1, name: PV yard, vn_kv: 0.4, role: pv, x: 520, y: 60}
  - {id: 2, name: Academic loads, vn_kv: 0.4, role: load, x: 760, y: 150}
  - {id: 3, name: Battery storage, vn_kv: 0.4, role: battery, x: 760, y: 240}

lines:
  - {name: PV feeder, from_bus: 0, to_bus: 1, kind: line, length_km: 0.18, max_i_ka: 1.0}
  - {name: Academic feeder, from_bus: 0, to_bus: 2, kind: line, length_km: 0.28, max_i_ka: 1.0}
  - {name: Battery feeder, from_bus: 0, to_bus: 3, kind: line, length_km: 0.16, max_i_ka: 1.0}

# 200 kWp total = MATLAB Microgrid.PVMVA 0.2 (panel parallel strings scaled 10 -> 4).
# Measured PV power replays onto these arrays; night standby readings clip to zero.
pv_arrays:
  - {name: PV array 0, bus: 1, p_mw: 0.12}
  - {name: PV array 1, bus: 1, p_mw: 0.08}

# Campus MG2 static loads = MATLAB pLoad21 / pLoad22 / pLoad33 (CampusMicrogridInputData.m
# load override): 150/100/100 kW, a 3:2:2 split of the ~350 kW observed peak, with
# Q = 0.2 P (pf 0.981). Measured total demand scales these bases at every 15-min interval.
# All three sit on the Academic-loads bus, matching the grouped MG2 load network; the
# MATLAB HVAC/ProcessingMotorLoad (0.15 MVA) is bookkeeping-only and disconnected in the
# islanded snapshot, so it is intentionally absent here.
loads:
  - {name: Academic load A, bus: 2, p_mw: 0.15, q_mvar: 0.030}   # MATLAB pLoad21, 150 kW / 30 kvar
  - {name: Academic load B, bus: 2, p_mw: 0.10, q_mvar: 0.020}   # MATLAB pLoad22, 100 kW / 20 kvar
  - {name: Academic load C, bus: 2, p_mw: 0.10, q_mvar: 0.020}   # MATLAB pLoad33, 100 kW / 20 kvar
